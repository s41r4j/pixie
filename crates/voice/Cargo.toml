[package]
name = "openclicky-voice"
description = "Audio bus (UI sounds) + speech traits: stt, tts, vad, aec"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["rodio"]
# Real speaker output. Without it only the logic + test outputs compile.
rodio = ["dep:rodio"]

[dependencies]
openclicky-core.workspace = true
log.workspace = true
serde.workspace = true
rodio = { version = "0.20", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
