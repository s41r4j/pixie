[package]
name = "openclicky-desktop"
description = "openclicky macOS app (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openclicky_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openclicky"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openclicky-core.workspace = true
openclicky-voice.workspace = true
openclicky-llm.workspace = true
openclicky-tools.workspace = true
openclicky-mcp.workspace = true
openclicky-native-host.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-drag = "2"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
chrono = "0.4"
sha2 = "0.10"
rand.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
