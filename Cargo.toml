[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/core",
  "crates/tools",
  "crates/llm",
  "crates/voice",
  "crates/capture",
  "crates/mcp",
  "crates/native-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/openclicky/openclicky"
rust-version = "1.80"

[workspace.dependencies]
openclicky-core = { path = "crates/core" }
openclicky-voice = { path = "crates/voice" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
rand = "0.8"
